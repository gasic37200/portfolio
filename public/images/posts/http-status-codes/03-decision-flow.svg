<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="760" height="600" rx="16" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">어떤 코드를 고를까: 위에서부터 차례로 묻기</text>

  <!-- Questions (left) -->
  <g>
    <rect x="60" y="66" width="330" height="48" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="78" y="87" font-size="14" font-weight="700" fill="#0f172a">1. 누구인지 확인됐나?</text>
    <text x="78" y="105" font-size="11" fill="#64748b">토큰·API 키가 있고 유효한가</text>

    <rect x="60" y="140" width="330" height="48" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="78" y="161" font-size="14" font-weight="700" fill="#0f172a">2. 그 사람에게 권한이 있나?</text>
    <text x="78" y="179" font-size="11" fill="#64748b">역할·소유자 확인</text>

    <rect x="60" y="214" width="330" height="48" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="78" y="235" font-size="14" font-weight="700" fill="#0f172a">3. 대상이 있나?</text>
    <text x="78" y="253" font-size="11" fill="#64748b">id·경로로 찾을 수 있는가</text>

    <rect x="60" y="288" width="330" height="48" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="78" y="309" font-size="14" font-weight="700" fill="#0f172a">4. 요청 형식과 값이 맞나?</text>
    <text x="78" y="327" font-size="11" fill="#64748b">JSON 문법·필수값·타입·허용하는 값</text>

    <rect x="60" y="362" width="330" height="48" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="78" y="383" font-size="14" font-weight="700" fill="#0f172a">5. 지금 상태에서 할 수 있나?</text>
    <text x="78" y="401" font-size="11" fill="#64748b">이미 수거됨, 같은 키에 다른 내용</text>
  </g>

  <!-- Down arrows with 예 -->
  <g stroke="#64748b" stroke-width="2">
    <path d="M225 115 L225 137" marker-end="url(#d)"/>
    <path d="M225 189 L225 211" marker-end="url(#d)"/>
    <path d="M225 263 L225 285" marker-end="url(#d)"/>
    <path d="M225 337 L225 359" marker-end="url(#d)"/>
    <path d="M225 411 L225 435" marker-end="url(#d)"/>
  </g>
  <g font-size="11" fill="#059669" font-weight="700">
    <text x="233" y="131">예</text>
    <text x="233" y="205">예</text>
    <text x="233" y="279">예</text>
    <text x="233" y="353">예</text>
    <text x="233" y="428">예</text>
  </g>

  <!-- Right arrows with 아니오 -->
  <g stroke="#d97706" stroke-width="2">
    <path d="M391 90 L466 90" marker-end="url(#r)"/>
    <path d="M391 164 L466 164" marker-end="url(#r)"/>
    <path d="M391 238 L466 238" marker-end="url(#r)"/>
    <path d="M391 312 L466 312" marker-end="url(#r)"/>
    <path d="M391 386 L466 386" marker-end="url(#r)"/>
  </g>
  <g font-size="11" fill="#b45309" font-weight="700" text-anchor="middle">
    <text x="428" y="83">아니오</text>
    <text x="428" y="157">아니오</text>
    <text x="428" y="231">아니오</text>
    <text x="428" y="305">아니오</text>
    <text x="428" y="379">아니오</text>
  </g>

  <!-- Answers (right) -->
  <g>
    <rect x="470" y="66" width="250" height="48" rx="10" fill="#fff7ed" stroke="#d97706"/>
    <text x="486" y="87" font-size="14" font-weight="700" fill="#9a3412">401 Unauthorized</text>
    <text x="486" y="105" font-size="11" fill="#64748b">인증 실패</text>

    <rect x="470" y="140" width="250" height="48" rx="10" fill="#fff7ed" stroke="#d97706"/>
    <text x="486" y="161" font-size="14" font-weight="700" fill="#9a3412">403 Forbidden</text>
    <text x="486" y="179" font-size="11" fill="#64748b">존재를 숨기려면 404</text>

    <rect x="470" y="214" width="250" height="48" rx="10" fill="#fff7ed" stroke="#d97706"/>
    <text x="486" y="235" font-size="14" font-weight="700" fill="#9a3412">404 Not Found</text>
    <text x="486" y="253" font-size="11" fill="#64748b">없는 리소스</text>

    <rect x="470" y="288" width="250" height="48" rx="10" fill="#fff7ed" stroke="#d97706"/>
    <text x="486" y="309" font-size="14" font-weight="700" fill="#9a3412">400 Bad Request</text>
    <text x="486" y="327" font-size="11" fill="#64748b">값 검증 실패를 422로 나누는 팀도 있음</text>

    <rect x="470" y="362" width="250" height="48" rx="10" fill="#fff7ed" stroke="#d97706"/>
    <text x="486" y="383" font-size="14" font-weight="700" fill="#9a3412">409 Conflict</text>
    <text x="486" y="401" font-size="11" fill="#64748b">리소스의 현재 상태와 충돌</text>
  </g>

  <!-- Success -->
  <rect x="60" y="438" width="660" height="88" rx="12" fill="#ecfdf5" stroke="#059669"/>
  <text x="80" y="462" font-size="14" font-weight="700" fill="#065f46">모두 통과하고 처리에 성공했다 → 2xx</text>
  <g font-size="12" fill="#0f172a">
    <rect x="80" y="476" width="190" height="34" rx="17" fill="#fff" stroke="#a7f3d0"/>
    <text x="175" y="498" text-anchor="middle">새로 만들었다 → 201</text>
    <rect x="285" y="476" width="210" height="34" rx="17" fill="#fff" stroke="#a7f3d0"/>
    <text x="390" y="498" text-anchor="middle">돌려줄 본문이 없다 → 204</text>
    <rect x="510" y="476" width="190" height="34" rx="17" fill="#fff" stroke="#a7f3d0"/>
    <text x="605" y="498" text-anchor="middle">그 밖의 성공 → 200</text>
  </g>

  <!-- 5xx -->
  <rect x="40" y="542" width="680" height="42" rx="8" fill="#fee2e2"/>
  <text x="380" y="561" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">어느 단계든 서버 쪽이 실패하면 5xx</text>
  <text x="380" y="577" text-anchor="middle" font-size="11" fill="#991b1b">버그·예외 500 · 윗단이 이상한 응답 502 · 과부하·점검 503 · 윗단 시간 초과 504</text>
</svg>
