<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2563eb"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#059669"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#dc2626"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="760" height="660" rx="16" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Access 토큰과 Refresh 토큰: 로그인부터 재발급(회전)까지</text>

  <!-- Participants -->
  <rect x="50" y="60" width="140" height="40" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="120" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">클라이언트</text>
  <rect x="330" y="60" width="140" height="40" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="400" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">API 서버</text>
  <rect x="570" y="60" width="160" height="40" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="650" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">서버 저장소 (Redis)</text>

  <!-- Lifelines -->
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4">
    <path d="M120 100 L120 580"/>
    <path d="M400 100 L400 580"/>
    <path d="M650 100 L650 580"/>
  </g>

  <g font-size="11">
    <!-- 1. login -->
    <path d="M122 135 L396 135" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
    <text x="260" y="128" text-anchor="middle" fill="#1e3a8a">① 로그인 (아이디·비밀번호)</text>
    <path d="M402 170 L646 170" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
    <text x="525" y="163" text-anchor="middle" fill="#1e3a8a">refresh 저장 (만료 시간과 함께)</text>
    <path d="M398 205 L124 205" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>
    <text x="260" y="198" text-anchor="middle" fill="#065f46">access(짧게) + refresh(길게) 발급</text>

    <!-- 2. normal request -->
    <path d="M122 250 L396 250" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
    <text x="260" y="243" text-anchor="middle" fill="#1e3a8a">② Authorization: Bearer {access}</text>
    <rect x="412" y="240" width="200" height="24" rx="12" fill="#dbeafe"/>
    <text x="512" y="256" text-anchor="middle" fill="#1e3a8a">서명·exp만 확인, 저장소 안 봄</text>
    <path d="M398 300 L124 300" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>
    <text x="260" y="293" text-anchor="middle" fill="#065f46">200 OK</text>
  </g>

  <!-- Time passes -->
  <rect x="40" y="322" width="680" height="28" rx="8" fill="#fef3c7"/>
  <text x="380" y="341" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">시간이 지나 access 토큰이 만료됨</text>

  <g font-size="11">
    <!-- 3. expired -->
    <path d="M122 385 L396 385" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
    <text x="260" y="378" text-anchor="middle" fill="#1e3a8a">③ Bearer {만료된 access}</text>
    <path d="M398 415 L124 415" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
    <text x="260" y="408" text-anchor="middle" fill="#991b1b">401 Unauthorized (exp 지남)</text>

    <!-- 4. refresh -->
    <path d="M122 455 L396 455" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
    <text x="260" y="448" text-anchor="middle" fill="#1e3a8a">④ refresh로 재발급 요청</text>
    <path d="M402 490 L646 490" stroke="#d97706" stroke-width="2" marker-end="url(#o)"/>
    <text x="525" y="483" text-anchor="middle" fill="#92400e">기존 refresh 꺼내면서 삭제 (한 번만)</text>
    <path d="M402 525 L646 525" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
    <text x="525" y="518" text-anchor="middle" fill="#1e3a8a">새 refresh 저장 (회전)</text>
    <path d="M398 560 L124 560" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>
    <text x="260" y="553" text-anchor="middle" fill="#065f46">새 access + 새 refresh</text>
  </g>

  <!-- Bottom note -->
  <rect x="40" y="596" width="680" height="48" rx="8" fill="#fee2e2"/>
  <text x="380" y="616" text-anchor="middle" font-size="12" fill="#991b1b">회전: 쓴 refresh는 바로 폐기한다. 누가 옛 refresh를 훔쳐 다시 내밀어도 저장소에 없어 거절된다.</text>
  <text x="380" y="634" text-anchor="middle" font-size="12" fill="#991b1b">로그아웃할 때도 저장소에서 refresh를 지우면, 남은 access가 만료되는 순간 더는 이어 쓸 수 없다.</text>
</svg>
