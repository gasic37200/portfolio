<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="760" height="400" rx="16" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">JWT는 점(.)으로 이어 붙인 세 부분이다</text>

  <!-- Token string -->
  <rect x="30" y="58" width="700" height="38" rx="19" fill="#fff" stroke="#cbd5e1"/>
  <g font-family="Consolas, 'D2Coding', monospace" font-size="14" text-anchor="middle">
    <text x="140" y="82" fill="#d97706">eyJhbGciOiJIUzI1NiIs…</text>
    <text x="260" y="82" fill="#0f172a" font-weight="700">.</text>
    <text x="380" y="82" fill="#2563eb">eyJzdWIiOiI0MiIsInJv…</text>
    <text x="500" y="82" fill="#0f172a" font-weight="700">.</text>
    <text x="620" y="82" fill="#059669">SflKxwRJSMeKKF2QT4fw…</text>
  </g>

  <path d="M140 98 L140 116" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M380 98 L380 116" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M620 98 L620 116" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- Header -->
  <rect x="30" y="120" width="220" height="200" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <rect x="30" y="120" width="220" height="36" rx="12" fill="#d97706"/>
  <rect x="30" y="140" width="220" height="16" fill="#d97706"/>
  <text x="140" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Header</text>
  <text x="140" y="180" text-anchor="middle" font-size="12" fill="#334155">어떤 방식으로 서명했나</text>
  <g font-family="Consolas, 'D2Coding', monospace" font-size="12" fill="#0f172a">
    <text x="52" y="210">{</text>
    <text x="64" y="230">"alg": "HS256",</text>
    <text x="64" y="250">"typ": "JWT"</text>
    <text x="52" y="270">}</text>
  </g>
  <text x="140" y="304" text-anchor="middle" font-size="11" fill="#92400e">Base64URL 인코딩 → 누구나 읽음</text>

  <!-- Payload -->
  <rect x="270" y="120" width="220" height="200" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <rect x="270" y="120" width="220" height="36" rx="12" fill="#2563eb"/>
  <rect x="270" y="140" width="220" height="16" fill="#2563eb"/>
  <text x="380" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Payload</text>
  <text x="380" y="180" text-anchor="middle" font-size="12" fill="#334155">누구의, 언제까지 유효한 토큰인가</text>
  <g font-family="Consolas, 'D2Coding', monospace" font-size="12" fill="#0f172a">
    <text x="292" y="210">{</text>
    <text x="304" y="226">"sub": "42",</text>
    <text x="304" y="242">"role": "USER",</text>
    <text x="304" y="258">"iat": 1792000000,</text>
    <text x="304" y="274">"exp": 1792001800</text>
    <text x="292" y="290">}</text>
  </g>
  <text x="380" y="310" text-anchor="middle" font-size="11" fill="#1e3a8a">Base64URL 인코딩 → 누구나 읽음</text>

  <!-- Signature -->
  <rect x="510" y="120" width="220" height="200" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <rect x="510" y="120" width="220" height="36" rx="12" fill="#059669"/>
  <rect x="510" y="140" width="220" height="16" fill="#059669"/>
  <text x="620" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Signature</text>
  <text x="620" y="180" text-anchor="middle" font-size="12" fill="#334155">앞 두 부분이 안 바뀌었다는 증거</text>
  <g font-family="Consolas, 'D2Coding', monospace" font-size="12" fill="#0f172a">
    <text x="532" y="210">HMACSHA256(</text>
    <text x="544" y="230">header + "." + payload,</text>
    <text x="544" y="250">비밀 키</text>
    <text x="532" y="270">)</text>
  </g>
  <text x="620" y="304" text-anchor="middle" font-size="11" fill="#065f46">비밀 키가 없으면 만들 수 없음</text>

  <rect x="30" y="340" width="700" height="40" rx="8" fill="#fef3c7"/>
  <text x="380" y="365" text-anchor="middle" font-size="12" fill="#92400e">Header와 Payload는 암호화가 아니라 인코딩이다. 비밀번호·민감정보는 Payload에 넣지 않는다</text>
</svg>
