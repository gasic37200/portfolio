<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2563eb"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="760" height="330" rx="16" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">섞어 쓰는 안: 결과를 세 곳으로 나눠 보낸다</text>

  <rect x="40" y="138" width="170" height="64" rx="12" fill="#fff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="125" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">이슈 세션</text>
  <text x="125" y="186" text-anchor="middle" font-size="11" fill="#64748b">작업이 끝나면</text>

  <!-- Main -->
  <rect x="470" y="62" width="150" height="50" rx="10" fill="#0f172a"/>
  <text x="545" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">메인 세션</text>
  <text x="634" y="84" font-size="11" fill="#64748b">짧게 유지</text>
  <text x="634" y="100" font-size="11" fill="#64748b">정리용이 멈춰도 앎</text>
  <path d="M212 150 L466 90" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <rect x="268" y="92" width="130" height="26" rx="13" fill="#dbeafe"/>
  <text x="333" y="110" text-anchor="middle" font-size="12" fill="#1e3a8a">한두 줄 신호</text>

  <!-- Organizer -->
  <rect x="470" y="145" width="150" height="50" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="545" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">정리용</text>
  <text x="634" y="167" font-size="11" fill="#64748b">기록을 정리하는</text>
  <text x="634" y="183" font-size="11" fill="#64748b">일꾼</text>
  <path d="M212 170 L466 170" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="290" y="146" width="90" height="26" rx="13" fill="#e2e8f0"/>
  <text x="335" y="164" text-anchor="middle" font-size="12" fill="#334155">전체 보고</text>

  <!-- Files -->
  <rect x="470" y="228" width="150" height="50" rx="10" fill="#d1fae5" stroke="#059669"/>
  <text x="545" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">파일</text>
  <text x="545" y="268" text-anchor="middle" font-size="11" fill="#065f46">PR · 이슈 · docs</text>
  <text x="634" y="250" font-size="11" fill="#059669">사라지지 않는</text>
  <text x="634" y="266" font-size="11" fill="#059669">실제 기록</text>
  <path d="M212 190 L466 250" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>
  <path d="M545 195 L545 224" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#g)"/>
  <rect x="290" y="226" width="90" height="26" rx="13" fill="#d1fae5"/>
  <text x="335" y="244" text-anchor="middle" font-size="12" fill="#065f46">실제 기록</text>

  <text x="380" y="310" text-anchor="middle" font-size="12" fill="#64748b">메시지는 세션 제목이 아니라 세션 ID로 보낸다</text>
</svg>
