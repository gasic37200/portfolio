<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="760" height="560" rx="16" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">기능마다 Redis에 보내는 명령</text>

  <!-- Left panel: email -->
  <rect x="24" y="58" width="348" height="484" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="198" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">이메일 인증</text>

  <!-- step 1 -->
  <text x="40" y="112" font-size="12" font-weight="700" fill="#0f172a">① 인증번호 발송</text>
  <rect x="40" y="122" width="316" height="128" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <g font-size="11" font-family="Consolas, 'D2Coding', monospace" fill="#0f172a">
    <text x="54" y="144">SET cooldown "1" NX EX 60</text>
    <text x="54" y="196">SET code "123456" EX 300</text>
  </g>
  <g font-size="11" fill="#475569">
    <text x="54" y="162">키가 이미 있으면 실패 → 재발송 제한</text>
    <text x="54" y="178">남은 초는 TTL 명령으로 알려 줌</text>
    <text x="54" y="214">재발송하면 같은 키에 덮어써 옛 번호 무효</text>
    <text x="54" y="236" fill="#b91c1c">메일 발송 실패 → 두 키 DEL (다시 시도 가능)</text>
  </g>

  <path d="M198 252 L198 270" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- step 2 -->
  <text x="40" y="290" font-size="12" font-weight="700" fill="#0f172a">② 인증번호 확인</text>
  <rect x="40" y="300" width="316" height="96" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <g font-size="11" font-family="Consolas, 'D2Coding', monospace" fill="#0f172a">
    <text x="54" y="322">GET code</text>
    <text x="54" y="358">DEL code</text>
    <text x="54" y="380">SET verified "true" EX 1800</text>
  </g>
  <g font-size="11" fill="#475569">
    <text x="54" y="340">없으면 만료 · 다르면 불일치 오류</text>
    <text x="140" y="358">같은 번호로 두 번 인증 못 함</text>
  </g>

  <path d="M198 398 L198 416" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- step 3 -->
  <text x="40" y="436" font-size="12" font-weight="700" fill="#0f172a">③ 회원가입</text>
  <rect x="40" y="446" width="316" height="80" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <g font-size="11" font-family="Consolas, 'D2Coding', monospace" fill="#0f172a">
    <text x="54" y="468">EXISTS verified</text>
    <text x="54" y="508">DEL verified</text>
  </g>
  <g font-size="11" fill="#475569">
    <text x="54" y="486">없으면 "인증 안 됨" → 가입 거절</text>
    <text x="150" y="508">회원 저장 뒤, 재사용 방지</text>
  </g>

  <!-- Right panel: refresh -->
  <rect x="388" y="58" width="348" height="484" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="562" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">Refresh 토큰</text>

  <!-- step 1 -->
  <text x="404" y="112" font-size="12" font-weight="700" fill="#0f172a">① 로그인 (일반 · 소셜 · 소셜 가입)</text>
  <rect x="404" y="122" width="316" height="108" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <g font-size="11" fill="#475569">
    <text x="418" y="144">32바이트 랜덤 토큰 생성</text>
    <text x="418" y="184">키에는 원문 대신 SHA-256 해시</text>
    <text x="418" y="208" fill="#047857">원문은 쿠키로만 (Max-Age 1일 = TTL)</text>
  </g>
  <g font-size="11" font-family="Consolas, 'D2Coding', monospace" fill="#0f172a">
    <text x="418" y="166">SET refresh:{hash} memberId EX 1일</text>
  </g>

  <path d="M562 232 L562 270" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- step 2 -->
  <text x="404" y="290" font-size="12" font-weight="700" fill="#0f172a">② 재발급 (회전)</text>
  <rect x="404" y="300" width="316" height="116" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <g font-size="11" font-family="Consolas, 'D2Coding', monospace" fill="#0f172a">
    <text x="418" y="322">GETDEL refresh:{hash}</text>
    <text x="418" y="398">SET refresh:{새 hash} memberId EX 1일</text>
  </g>
  <g font-size="11" fill="#475569">
    <text x="418" y="342">꺼내기와 지우기를 한 명령으로</text>
    <text x="418" y="358">→ 동시에 두 요청이 와도 한쪽만 성공</text>
    <text x="418" y="376" fill="#b91c1c">없으면 401 · 있으면 새 Access 발급</text>
  </g>

  <path d="M562 418 L562 436" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- step 3 -->
  <text x="404" y="456" font-size="12" font-weight="700" fill="#0f172a">③ 로그아웃</text>
  <rect x="404" y="466" width="316" height="60" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <g font-size="11" font-family="Consolas, 'D2Coding', monospace" fill="#0f172a">
    <text x="418" y="488">DEL refresh:{hash}</text>
  </g>
  <text x="418" y="510" font-size="11" fill="#475569">쿠키도 Max-Age 0으로 지움 · 키 없어도 성공</text>
</svg>
