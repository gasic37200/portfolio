<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 482" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="760" height="482" rx="16" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">운영 Redis: 서버 1대에서 세 겹으로 막기</text>

  <!-- Outsider -->
  <rect x="24" y="190" width="104" height="64" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="76" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">외부</text>
  <text x="76" y="238" text-anchor="middle" font-size="11" fill="#475569">:6379 접속 시도</text>

  <!-- Layer 1: security group -->
  <rect x="150" y="62" width="400" height="400" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="166" y="86" font-size="13" font-weight="700" fill="#b91c1c">① AWS 보안 그룹</text>
  <text x="166" y="104" font-size="11" fill="#475569">6379 인바운드를 열지 않음</text>

  <!-- Layer 2: EC2 + loopback binding -->
  <rect x="176" y="118" width="356" height="324" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="192" y="142" font-size="13" font-weight="700" fill="#b45309">② EC2 1대 · 포트 127.0.0.1:6379</text>
  <text x="192" y="160" font-size="11" fill="#475569">서버 자신에게만 열림 (0.0.0.0 아님)</text>

  <!-- App container -->
  <rect x="196" y="178" width="140" height="56" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="266" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">replant-app</text>
  <text x="266" y="221" text-anchor="middle" font-size="11" fill="#475569">같은 서버의 앱</text>

  <!-- Layer 3: Redis -->
  <rect x="196" y="252" width="318" height="168" rx="10" fill="#fff" stroke="#059669" stroke-width="1.5"/>
  <text x="212" y="276" font-size="13" font-weight="700" fill="#047857">③ replant-redis (redis:8-alpine)</text>
  <text x="212" y="296" font-size="11" fill="#475569">requirepass: 비밀번호 없으면 명령 거부</text>
  <rect x="212" y="310" width="286" height="94" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="226" y="332" font-size="11" fill="#0f172a">메모리 상한 256mb · noeviction</text>
  <text x="226" y="352" font-size="11" fill="#0f172a">appendonly yes · 볼륨 redis-data:/data</text>
  <text x="226" y="372" font-size="11" fill="#0f172a">restart: unless-stopped</text>
  <text x="226" y="392" font-size="10" fill="#64748b">값은 .env에서 (비밀번호는 커밋 안 함)</text>

  <path d="M290 234 L330 250" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="340" y="232" font-size="11" fill="#1d4ed8">비밀번호로 접속</text>

  <!-- Blocked attempt -->
  <path d="M128 222 L146 222" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
  <g stroke="#dc2626" stroke-width="2.5">
    <path d="M140 270 L156 286"/>
    <path d="M156 270 L140 286"/>
  </g>
  <text x="76" y="300" text-anchor="middle" font-size="11" fill="#b91c1c">한 겹이 뚫려도</text>
  <text x="76" y="316" text-anchor="middle" font-size="11" fill="#b91c1c">다음 겹이 막는다</text>

  <!-- Right: why panel -->
  <rect x="572" y="62" width="164" height="400" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="654" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">왜 이렇게?</text>
  <g font-size="11" fill="#334155">
    <text x="586" y="118" font-weight="700" fill="#0f172a">ElastiCache 대신 컨테이너</text>
    <text x="586" y="136">공용 계정 허용 목록 밖</text>
    <text x="586" y="152">설정을 직접 정하고</text>
    <text x="586" y="168">장애·백업도 직접 책임</text>

    <text x="586" y="202" font-weight="700" fill="#0f172a">세 겹 차단</text>
    <text x="586" y="220">서버가 1대라 프라이빗</text>
    <text x="586" y="236">서브넷으로 나눌 대상 없음</text>

    <text x="586" y="270" font-weight="700" fill="#0f172a">noeviction</text>
    <text x="586" y="288">토큰이 몰래 지워지면</text>
    <text x="586" y="304">조용한 로그인 풀림</text>

    <text x="586" y="338" font-weight="700" fill="#0f172a">AOF + 볼륨</text>
    <text x="586" y="356">서버가 매일 18시 꺼지고</text>
    <text x="586" y="372">09시 켜져도 키가 남게</text>

    <text x="586" y="406" font-weight="700" fill="#0f172a">타임아웃 2초</text>
    <text x="586" y="424">Redis가 멈춰도 요청</text>
    <text x="586" y="440">스레드가 오래 안 묶이게</text>
  </g>
</svg>
