<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="760" height="680" rx="16" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">요청 하나가 지나가는 층: 누가 만든 부품인가</text>

  <!-- App boundary -->
  <rect x="44" y="168" width="410" height="376" rx="12" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <rect x="54" y="160" width="168" height="16" fill="#f8fafc"/>
  <text x="60" y="172" font-size="11" font-weight="700" fill="#475569">Spring Boot 앱 (jar 하나)</text>

  <!-- Arrows -->
  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#a)">
    <path d="M250 106 L250 118"/>
    <path d="M250 156 L250 194"/>
    <path d="M250 232 L250 244"/>
    <path d="M250 282 L250 294"/>
    <path d="M250 332 L250 344"/>
    <path d="M250 382 L250 394"/>
    <path d="M250 432 L250 444"/>
    <path d="M250 482 L250 494"/>
    <path d="M250 532 L250 570"/>
  </g>

  <!-- Boxes -->
  <g font-size="14" font-weight="700" fill="#0f172a">
    <!-- outside: gray -->
    <rect x="60" y="70" width="380" height="36" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="60" y="70" width="6" height="36" rx="3" fill="#94a3b8"/>
    <text x="80" y="93">브라우저</text>

    <rect x="60" y="120" width="380" height="36" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="60" y="120" width="6" height="36" rx="3" fill="#94a3b8"/>
    <text x="80" y="143">Nginx</text>

    <!-- servlet: green -->
    <rect x="60" y="196" width="380" height="36" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5"/>
    <rect x="60" y="196" width="6" height="36" rx="3" fill="#059669"/>
    <text x="80" y="219">서블릿 컨테이너 (Tomcat)</text>

    <rect x="60" y="246" width="380" height="36" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5"/>
    <rect x="60" y="246" width="6" height="36" rx="3" fill="#059669"/>
    <text x="80" y="269">필터 체인</text>

    <!-- spring: blue -->
    <rect x="60" y="296" width="380" height="36" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="60" y="296" width="6" height="36" rx="3" fill="#2563eb"/>
    <text x="80" y="319">DispatcherServlet</text>

    <rect x="60" y="346" width="380" height="36" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="60" y="346" width="6" height="36" rx="3" fill="#2563eb"/>
    <text x="80" y="369">인터셉터</text>

    <!-- my code: amber -->
    <rect x="60" y="396" width="380" height="36" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="60" y="396" width="6" height="36" rx="3" fill="#d97706"/>
    <text x="80" y="419">컨트롤러</text>

    <rect x="60" y="446" width="380" height="36" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="60" y="446" width="6" height="36" rx="3" fill="#d97706"/>
    <text x="80" y="469">서비스</text>

    <rect x="60" y="496" width="380" height="36" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="60" y="496" width="6" height="36" rx="3" fill="#d97706"/>
    <text x="80" y="519">리포지토리</text>

    <rect x="60" y="572" width="380" height="36" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="60" y="572" width="6" height="36" rx="3" fill="#94a3b8"/>
    <text x="80" y="595">DB</text>
  </g>

  <!-- Box side notes -->
  <g font-size="11" fill="#64748b" text-anchor="end">
    <text x="426" y="92">HTTP 요청을 보냄</text>
    <text x="426" y="142">리버스 프록시, 앱으로 넘김</text>
    <text x="426" y="218">요청마다 스레드 배정</text>
    <text x="426" y="268">Spring Security, JWT 필터</text>
    <text x="426" y="318">모든 요청의 입구</text>
    <text x="426" y="368">컨트롤러 앞뒤 (있을 때만)</text>
    <text x="426" y="418">@RestController</text>
    <text x="426" y="468">@Service, @Transactional</text>
    <text x="426" y="518">DB 접근</text>
    <text x="426" y="594">데이터 저장소</text>
  </g>

  <!-- Brackets -->
  <g fill="none" stroke-width="2">
    <path d="M462 72 L470 72 L470 154 L462 154" stroke="#94a3b8"/>
    <path d="M462 198 L470 198 L470 280 L462 280" stroke="#059669"/>
    <path d="M462 298 L470 298 L470 380 L462 380" stroke="#2563eb"/>
    <path d="M462 398 L470 398 L470 530 L462 530" stroke="#d97706"/>
    <path d="M462 574 L470 574 L470 606 L462 606" stroke="#94a3b8"/>
  </g>
  <g font-size="13" font-weight="700">
    <text x="484" y="108" fill="#475569">자바 바깥</text>
    <text x="484" y="234" fill="#047857">서블릿 스펙</text>
    <text x="484" y="334" fill="#1d4ed8">스프링 (Spring MVC)</text>
    <text x="484" y="459" fill="#b45309">내 코드</text>
    <text x="484" y="595" fill="#475569">자바 바깥</text>
  </g>
  <g font-size="11" fill="#475569">
    <text x="484" y="126">RePlant은 Nginx 뒤 Docker 컨테이너</text>
    <text x="484" y="252">jakarta.servlet 규격</text>
    <text x="484" y="268">Tomcat이 생명주기·스레드 관리</text>
    <text x="484" y="352">스프링이 만든 부품</text>
    <text x="484" y="368">요청을 컨트롤러로 나눠 줌</text>
    <text x="484" y="477">비즈니스 로직</text>
    <text x="484" y="493">스프링이 빈으로 만들고 불러 줌</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#334155">
    <rect x="96" y="634" width="12" height="12" rx="3" fill="#94a3b8"/><text x="114" y="645">자바 바깥</text>
    <rect x="236" y="634" width="12" height="12" rx="3" fill="#059669"/><text x="254" y="645">서블릿 스펙</text>
    <rect x="384" y="634" width="12" height="12" rx="3" fill="#2563eb"/><text x="402" y="645">스프링</text>
    <rect x="510" y="634" width="12" height="12" rx="3" fill="#d97706"/><text x="528" y="645">내 코드</text>
  </g>
</svg>
