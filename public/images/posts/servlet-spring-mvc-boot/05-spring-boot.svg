<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="560" rx="16" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Spring Boot: main() 하나가 서버까지 띄운다</text>

  <!-- Startup flow -->
  <g>
    <rect x="30" y="64" width="128" height="80" rx="10" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="48" cy="80" r="9" fill="#475569"/><text x="48" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">1</text>
    <text x="94" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">main()</text>
    <text x="94" y="124" text-anchor="middle" font-size="10" fill="#475569">java -jar app.jar</text>

    <rect x="173" y="64" width="128" height="80" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="191" cy="80" r="9" fill="#475569"/><text x="191" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">2</text>
    <text x="237" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">SpringApplication</text>
    <text x="237" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">.run()</text>
    <text x="237" y="136" text-anchor="middle" font-size="10" fill="#475569">부트 시작</text>

    <rect x="316" y="64" width="128" height="80" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="334" cy="80" r="9" fill="#475569"/><text x="334" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">3</text>
    <text x="380" y="104" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">ApplicationContext</text>
    <text x="380" y="120" text-anchor="middle" font-size="10" fill="#475569">스프링 컨테이너 생성</text>
    <text x="380" y="136" text-anchor="middle" font-size="10" fill="#475569">빈 등록 · 자동 설정</text>

    <rect x="459" y="64" width="128" height="80" rx="10" fill="#fff" stroke="#059669" stroke-width="1.5"/>
    <circle cx="477" cy="80" r="9" fill="#475569"/><text x="477" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">4</text>
    <text x="523" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">내장 Tomcat</text>
    <text x="523" y="120" text-anchor="middle" font-size="10" fill="#475569">서버 시작</text>
    <text x="523" y="136" text-anchor="middle" font-size="10" fill="#475569">DispatcherServlet 등록</text>

    <rect x="602" y="64" width="128" height="80" rx="10" fill="#fff" stroke="#059669" stroke-width="1.5"/>
    <circle cx="620" cy="80" r="9" fill="#475569"/><text x="620" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">5</text>
    <text x="666" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">요청 대기</text>
    <text x="666" y="120" text-anchor="middle" font-size="10" fill="#475569">포트 8080 (기본)</text>
    <text x="666" y="136" text-anchor="middle" font-size="10" fill="#475569">스레드 풀 준비</text>
  </g>
  <g stroke="#475569" stroke-width="1.5" marker-end="url(#k)">
    <path d="M159 104 L171 104"/>
    <path d="M302 104 L314 104"/>
    <path d="M445 104 L457 104"/>
    <path d="M588 104 L600 104"/>
  </g>

  <text x="30" y="176" font-size="14" font-weight="700" fill="#0f172a">Boot가 대신 해 주는 것</text>

  <!-- Card A -->
  <rect x="30" y="188" width="340" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="46" y="212" font-size="13" font-weight="700" fill="#1d4ed8">@SpringBootApplication =</text>
  <g font-size="11">
    <text x="46" y="240"><tspan font-weight="700" fill="#0f172a">@SpringBootConfiguration</tspan><tspan fill="#475569" dx="8">설정 클래스</tspan></text>
    <text x="46" y="264"><tspan font-weight="700" fill="#0f172a">+ @EnableAutoConfiguration</tspan><tspan fill="#475569" dx="8">자동 설정 켜기</tspan></text>
    <text x="46" y="288"><tspan font-weight="700" fill="#0f172a">+ @ComponentScan</tspan><tspan fill="#475569" dx="8">이 패키지 아래 빈 찾기</tspan></text>
  </g>
  <text x="46" y="316" font-size="10" fill="#64748b">③에서 내 빈과 스프링 부품 빈이 함께 등록된다</text>

  <!-- Card B -->
  <rect x="390" y="188" width="340" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="406" y="212" font-size="13" font-weight="700" fill="#1d4ed8">자동 설정 = 조건부 빈 등록</text>
  <text x="406" y="238" font-size="11" font-weight="700" fill="#0f172a">@ConditionalOnClass</text>
  <text x="406" y="254" font-size="11" fill="#475569">이 클래스가 classpath에 있으면 등록</text>
  <text x="406" y="278" font-size="11" font-weight="700" fill="#0f172a">@ConditionalOnMissingBean</text>
  <text x="406" y="294" font-size="11" fill="#475569">내가 같은 빈을 만들지 않았으면 등록</text>
  <text x="406" y="316" font-size="10" fill="#64748b">내 빈이 있으면 자동 설정이 물러난다</text>

  <!-- Card C -->
  <rect x="30" y="344" width="340" height="124" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="46" y="368" font-size="13" font-weight="700" fill="#1d4ed8">starter 의존성</text>
  <text x="46" y="392" font-size="11" fill="#0f172a">웹 MVC starter 하나에</text>
  <text x="46" y="410" font-size="11" fill="#0f172a">Spring MVC + 내장 Tomcat + Jackson</text>
  <text x="46" y="434" font-size="11" fill="#475569">라이브러리끼리 맞는 버전도 Boot가 관리</text>
  <text x="46" y="454" font-size="10" fill="#64748b">예: spring-boot-starter-web</text>

  <!-- Card D -->
  <rect x="390" y="344" width="340" height="124" rx="12" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
  <text x="406" y="368" font-size="13" font-weight="700" fill="#b45309">application.yml · 프로파일</text>
  <text x="406" y="392" font-size="11" fill="#0f172a">server.port, spring.datasource.url 같은 값</text>
  <text x="406" y="410" font-size="11" fill="#0f172a">코드 수정 없이 바꾼다</text>
  <text x="406" y="434" font-size="11" fill="#475569">spring.profiles.active=prod</text>
  <text x="406" y="454" font-size="10" fill="#64748b">→ application-prod.yml을 추가로 읽는다</text>

  <!-- Legend -->
  <g font-size="12" fill="#334155">
    <rect x="30" y="482" width="12" height="12" rx="3" fill="#059669"/><text x="48" y="493">서블릿 (Tomcat)</text>
    <rect x="170" y="482" width="12" height="12" rx="3" fill="#2563eb"/><text x="188" y="493">스프링 · Boot</text>
    <rect x="296" y="482" width="12" height="12" rx="3" fill="#d97706"/><text x="314" y="493">내가 쓰는 것</text>
  </g>

  <rect x="30" y="508" width="700" height="36" rx="8" fill="#fef3c7"/>
  <text x="380" y="531" text-anchor="middle" font-size="12" fill="#92400e">Boot는 Spring을 대신하지 않는다. 요청 처리는 여전히 Spring MVC의 DispatcherServlet이 한다</text>
</svg>
