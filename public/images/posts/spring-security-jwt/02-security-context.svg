<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="420" rx="16" fill="#f8fafc"/>
  <text x="380" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">JWT 필터가 채우는 상자, 컨트롤러가 꺼내 쓰는 상자</text>

  <!-- Holder -->
  <rect x="30" y="60" width="440" height="330" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="46" y="84" font-size="13" font-weight="700" fill="#047857">SecurityContextHolder</text>
  <text x="46" y="102" font-size="11" fill="#475569">요청을 처리하는 스레드마다 하나 (기본 ThreadLocal)</text>

  <!-- Context -->
  <rect x="50" y="116" width="400" height="258" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="66" y="140" font-size="13" font-weight="700" fill="#1d4ed8">SecurityContext</text>

  <!-- Authentication -->
  <rect x="70" y="154" width="360" height="204" rx="10" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
  <text x="86" y="178" font-size="13" font-weight="700" fill="#0f172a">Authentication</text>
  <text x="86" y="196" font-size="11" fill="#475569">구현체: UsernamePasswordAuthenticationToken</text>

  <rect x="86" y="208" width="328" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="98" y="227" font-size="12" font-weight="700" fill="#0f172a">principal (누구인가)</text>
  <text x="98" y="244" font-size="11" fill="#b45309">AuthMember(memberId=42, role="MEMBER")</text>

  <rect x="86" y="258" width="328" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="98" y="277" font-size="12" font-weight="700" fill="#0f172a">credentials (비밀번호 등)</text>
  <text x="98" y="294" font-size="11" fill="#475569">null — 토큰 검증이 이미 끝나서 둘 필요 없음</text>

  <rect x="86" y="308" width="328" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="98" y="327" font-size="12" font-weight="700" fill="#0f172a">authorities (무엇을 할 수 있나)</text>
  <text x="98" y="344" font-size="11" fill="#b45309">[ROLE_MEMBER] — "ROLE_" + 토큰의 role</text>

  <!-- Users on right -->
  <rect x="510" y="200" width="220" height="62" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">컨트롤러 파라미터</text>
  <text x="620" y="244" text-anchor="middle" font-size="11" fill="#475569">@AuthenticationPrincipal</text>
  <text x="620" y="258" text-anchor="middle" font-size="11" fill="#475569">AuthMember member</text>
  <path d="M416 230 L506 230" stroke="#475569" stroke-width="1.5" marker-end="url(#k)"/>

  <rect x="510" y="300" width="220" height="62" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">AuthorizationFilter</text>
  <text x="620" y="344" text-anchor="middle" font-size="11" fill="#475569">hasRole("ADMIN") 은</text>
  <text x="620" y="358" text-anchor="middle" font-size="11" fill="#475569">ROLE_ADMIN 이 있는지 본다</text>
  <path d="M416 330 L506 330" stroke="#475569" stroke-width="1.5" marker-end="url(#k)"/>

  <rect x="510" y="80" width="220" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="620" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">JwtAuthenticationFilter</text>
  <text x="620" y="124" text-anchor="middle" font-size="11" fill="#475569">토큰의 sub · role로</text>
  <text x="620" y="140" text-anchor="middle" font-size="11" fill="#475569">Authentication을 만들어 넣는다</text>
  <path d="M510 150 L432 176" stroke="#d97706" stroke-width="1.5" marker-end="url(#k)"/>
</svg>
